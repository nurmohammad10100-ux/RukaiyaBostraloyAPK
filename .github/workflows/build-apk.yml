name: Build Rukaiya Bostraloy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q RukaiyaBostraloyOfflineAPK.zip -d android-project
          echo "Project extracted:"
          find android-project -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: android-project/RukaiyaBostraloyOfflineAPK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rukaiya-Bostraloy-APK
          path: android-project/RukaiyaBostraloyOfflineAPK/app/build/outputs/apk/debug/app-debug.apk
